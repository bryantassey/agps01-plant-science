<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant Propagation Scavenger Hunt</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17283a;font:17px system-ui,sans-serif}header{background:#002855;color:white;padding:24px;border-bottom:5px solid #e5b53c}header h1{margin:8px 0;font-size:1.65rem}main{max-width:850px;margin:auto;padding:16px}section{background:white;border:1px solid #d5dce4;border-radius:12px;padding:18px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,button{font:inherit}input:not([type=file]),textarea{width:100%;padding:12px;border:1px solid #8191a3;border-radius:6px}textarea{min-height:100px}button{cursor:pointer;border:1px solid #002855;border-radius:7px;padding:12px;background:#002855;color:white;margin:4px 0}button.secondary{background:white;color:#002855}button.warn{background:#fff4d7;color:#704600;border-color:#b78622}button:disabled{opacity:.45;cursor:not-allowed}.item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:white;color:#002855;border-color:#d5dce4;gap:10px}.item span:last-child{font-size:.8em}progress{width:100%;height:16px;accent-color:#002855}img,canvas{max-width:100%;height:auto;display:block;margin:10px auto}canvas{touch-action:none;border:1px solid #aaa}small{color:#526171}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#a32020}#status{position:sticky;bottom:0;background:#002855;color:white;padding:10px;text-align:center;font-size:14px}#report{display:none}@media print{@page{margin:12mm}body{background:white;font-size:11pt}header,main,#status{display:none!important}#report{display:block}#report article{break-inside:avoid;page-break-inside:avoid;margin:0 0 15px;border-bottom:1px solid #aaa;padding-bottom:10px}#report img{max-height:90mm;max-width:100%;object-fit:contain;margin:5px 0}#report h2{font-size:14pt;margin:8px 0}#report p{margin:5px 0;white-space:pre-wrap}}
.hint{background:#fff8e5;border:1px solid #d9bb69;border-radius:8px;padding:12px;margin:12px 0}.hint summary{cursor:pointer;font-weight:600;color:#002855}.hint p{margin:10px 0 0}</style></head><body><header><small style="color:white">MERCED COLLEGE • DEPARTMENT OF AGRICULTURE • AGPS-01</small><h1>Plant Propagation Scavenger Hunt</h1>Explore · Identify · Document</header><main id="app"></main><div id="status" role="status">Opening local storage…</div><div id="report"></div><script>
'use strict';const methods=['Seed propagation','Softwood cutting','Semi-hardwood cutting','Hardwood cutting','Leaf cutting','Division','Separation – bulbs','Separation – rhizomes','Separation – offsets','Stolons/runners','Simple layering','Air layering','Grafting','Budding','Tissue culture'];const hints=["Look for structures containing mature seeds or evidence of germination.", "Examine the newest stem growth. Is it tender and flexible?", "Look for partially matured growth that is firmer than softwood but not fully woody.", "Look for fully matured woody stems rather than tender new growth.", "Consider whether a detached leaf or leaf section could produce a new plant.", "Look for multiple growing points that could be separated with roots attached.", "Look for a storage structure made of fleshy leaf bases or scales.", "Think about horizontal stems growing beneath or near the soil surface, with nodes and buds.", "Look for small daughter plants developing near the base of a parent plant.", "Look for horizontal aboveground stems that can produce new plants at nodes.", "Look for a flexible branch that could reach the soil while remaining attached to the parent.", "Consider a woody branch that could develop roots above ground while still attached to the parent.", "Examine how a section of stem from one plant has been joined to another plant.", "Consider whether a single bud rather than a section of stem has been transferred.", "Think about sterile conditions, culture media, and equipment used to grow small pieces of plant tissue."];const app=document.querySelector('#app'),status=document.querySelector('#status');let db,ready=false,pending=Promise.resolve(),failed=false;let state={name:'',peers:'',date:new Date().toLocaleDateString('en-CA'),entries:methods.map(()=>({plant:'',why:'',photo:'',marks:[],redo:false,note:''}))};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(!ready)return;const snapshot=structuredClone(state);status.textContent='Saving…';pending=pending.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{const t=db.transaction('work','readwrite');t.objectStore('work').put(snapshot,'current');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})).then(()=>{failed=false;status.textContent='Saved on this device'}).catch(()=>{failed=true;status.textContent='Save failed — export a backup before leaving.'});}function complete(e){return !!(e.photo&&e.why.trim())}function count(){return state.entries.filter(complete).length}function btn(t,fn,cls='secondary'){const b=document.createElement('button');b.textContent=t;b.className=cls;b.onclick=fn;return b}function actions(...buttons){const d=document.createElement('div');d.className='actions';d.append(...buttons);app.append(d)}function field(id,key){document.getElementById(id).oninput=e=>{state[key]=e.target.value;save()}}function home(){app.innerHTML=`<section><h2>Student information</h2><p>Explore together in groups of 2–4. Complete your own report on your own device. Do not remove or damage plants.</p><div class="hint"><strong>For the best experience, open this activity directly in Safari on iPhone or Chrome on Android. Avoid using the built-in browser within Canvas or other apps, particularly when generating your final PDF.</strong></div><label for="name">First and last name</label><input id="name" value="${esc(state.name)}"><label for="peers">Collaborating classmates (optional)</label><input id="peers" value="${esc(state.peers)}"><label for="date">Lab date</label><input id="date" type="date" value="${esc(state.date)}"></section><section id="list"><h2>${count()} of 15 discoveries complete</h2><progress max="15" value="${count()}"></progress><p>Choose any method to begin or revise.</p></section>`;['name','peers','date'].forEach(k=>field(k,k));methods.forEach((m,i)=>{const e=state.entries[i],b=btn('',()=>edit(i),'item');b.innerHTML=`<span>${i+1}. ${esc(m)}</span><span>${e.redo?'↻ Revisit':complete(e)?'✓ Complete':'Not complete'}</span>`;document.querySelector('#list').append(b)});actions(btn('Instructor review',()=>review(Math.max(0,state.entries.findIndex(e=>e.photo||e.why.trim())))),btn('Final review & PDF',finalReview,''));actions(btn('Export backup',backup),btn('Restore backup',restore),btn('Reset activity',()=>{if(confirm('Delete all saved work on this device?')){state={name:'',peers:'',date:new Date().toISOString().slice(0,10),entries:methods.map(()=>({plant:'',why:'',photo:'',marks:[],redo:false,note:''}))};save();home()}},'warn'))}async function photoData(file){const url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();const c=document.createElement('canvas'),scale=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.83)}finally{URL.revokeObjectURL(url)}}function edit(i){const e=state.entries[i];app.innerHTML=`<section><h2>${i+1}. ${esc(methods[i])}</h2><details class="hint"><summary>Need a hint?</summary><p>${esc(hints[i])}</p></details>${e.redo?'<p class="error">Needs revisit: '+esc(e.note)+'</p>':''}<label for="camera">Take a photograph</label><input id="camera" type="file" accept="image/*" capture="environment"><label for="upload">Or choose a photograph</label><input id="upload" type="file" accept="image/*"><div id="picture"></div><label for="plant">Plant name or material (optional)</label><input id="plant" value="${esc(e.plant)}"><label for="why">What characteristics or evidence support this method? If documenting potential material, explain how it could be used.</label><textarea id="why">${esc(e.why)}</textarea></section>`;['plant','why'].forEach(k=>document.getElementById(k).oninput=ev=>{e[k]=ev.target.value;save()});for(const id of ['camera','upload'])document.getElementById(id).onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{status.textContent='Processing photo…';e.photo=await photoData(f);e.marks=[];save();edit(i)}catch{alert('Could not open this photo. Try a JPEG or take a new photo.')}};if(e.photo)annotate(i);if(e.redo)actions(btn('Clear revisit flag',()=>{e.redo=false;e.note='';save();edit(i)}));actions(btn('Save & return to checklist',()=>{save();home()},''))}function draw(c,im,marks){const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);x.strokeStyle='#ff3020';x.lineWidth=Math.max(4,c.width/150);x.lineCap='round';x.lineJoin='round';for(const m of marks){const p=m.points.map(p=>[p[0]*c.width,p[1]*c.height]);if(!p.length)continue;const a=p[0],b=p[p.length-1];x.beginPath();if(m.type==='circle'){x.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.max(1,Math.abs(b[0]-a[0])/2),Math.max(1,Math.abs(b[1]-a[1])/2),0,0,Math.PI*2)}else{x.moveTo(...a);if(m.type==='arrow'){x.lineTo(...b);const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),l=c.width*.035;for(const d of [-.55,.55]){x.moveTo(...b);x.lineTo(b[0]-l*Math.cos(ang+d),b[1]-l*Math.sin(ang+d))}}else p.forEach(q=>x.lineTo(...q))}x.stroke()}}function annotate(i){const e=state.entries[i],d=document.querySelector('#picture'),c=document.createElement('canvas'),im=new Image();let mode='freehand',active=null;d.append(c);const bar=document.createElement('div');bar.className='actions';d.append(bar);['freehand','arrow','circle'].forEach(m=>bar.append(btn(m,()=>{mode=m;bar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===m)))})));bar.append(btn('Undo',()=>{e.marks.pop();draw(c,im,e.marks);save()}),btn('Clear marks',()=>{e.marks=[];draw(c,im,e.marks);save()}));im.onload=()=>{c.width=im.width;c.height=im.height;draw(c,im,e.marks)};im.src=e.photo;const point=ev=>{const r=c.getBoundingClientRect();return [(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height]};c.onpointerdown=ev=>{c.setPointerCapture(ev.pointerId);active={type:mode,points:[point(ev)]}};c.onpointermove=ev=>{if(active){active.points.push(point(ev));draw(c,im,[...e.marks,active])}};c.onpointerup=()=>{if(active){e.marks.push(active);active=null;save()}};c.onpointercancel=()=>{active=null;draw(c,im,e.marks)}}async function rendered(e){if(!e.photo)return '';if(!e.marks.length)return e.photo;const im=new Image();im.src=e.photo;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;draw(c,im,e.marks);return c.toDataURL('image/jpeg',.86)}async function review(i){const e=state.entries[i];app.innerHTML=`<section><h2>Instructor review · Method ${i+1} of 15</h2><p>${count()} of 15 discoveries complete</p><label for="reviewjump">Jump to a discovery</label><select id="reviewjump">${methods.map((m,j)=>`<option value="${j}" ${j===i?'selected':''}>${j+1}. ${esc(m)} — ${complete(state.entries[j])?'Complete':'Incomplete'}</option>`).join('')}</select><p>Record verbal feedback from your instructor. This is not a grade or approval.</p><h3>${esc(methods[i])}</h3><div id="reviewphoto"></div><p>${esc(e.plant)}</p><p>${esc(e.why)||'No explanation yet'}</p><label><input type="checkbox" id="redo" ${e.redo?'checked':''}> Needs revisit</label><label for="note">Correction note (optional)</label><textarea id="note">${esc(e.note)}</textarea></section>`;document.querySelector('#reviewjump').onchange=ev=>review(Number(ev.target.value));const target=document.querySelector('#reviewphoto');if(e.photo){const im=new Image();im.alt='Student discovery';target.append(im);im.src=e.photo;rendered(e).then(src=>{im.src=src}).catch(()=>{}); }else target.textContent='No photo yet';document.querySelector('#redo').onchange=ev=>{e.redo=ev.target.checked;save()};document.querySelector('#note').oninput=ev=>{e.note=ev.target.value;save()};const prev=btn('Previous',()=>review(i-1)),next=btn('Next',()=>review(i+1));prev.disabled=i===0;next.disabled=i===14;actions(prev,next,btn('Edit discovery',()=>edit(i)),btn('Revision checklist',revisions),btn('Home',home))}function revisions(){app.innerHTML='<section><h2>Revision checklist</h2><p>Revisit the discoveries identified during your instructor consultation.</p><div id="revisions"></div></section>';state.entries.forEach((e,i)=>{if(e.redo)document.querySelector('#revisions').append(btn(`${i+1}. ${methods[i]} — ${e.note}`,()=>edit(i),'item'))});if(!state.entries.some(e=>e.redo))document.querySelector('#revisions').textContent='No corrections marked.';actions(btn('Home',home))}function finalReview(){const missing=state.entries.map((e,i)=>complete(e)?null:methods[i]).filter(Boolean),flags=state.entries.filter(e=>e.redo).length;app.innerHTML=`<section><h2>Final review</h2><p>${esc(state.name)||'Student name missing'} · ${esc(state.date)}</p><p>${count()} of 15 complete.</p>${missing.length?'<p class="error">Incomplete: '+esc(missing.join(', '))+'</p>':''}${flags?'<p class="error">'+flags+' correction flags remain. Review before submitting.</p>':''}<p>Use Print / Save as PDF, then submit your individual PDF to Canvas. On iPhone, use the print preview share option to save to Files.</p></section>`;const b=btn('Print / Save as PDF',printReport,'');b.disabled=!!missing.length||!state.name.trim()||!state.date;actions(b,btn('Revision checklist',revisions),btn('Home',home))}async function printReport(){if(state.entries.some(e=>e.redo)&&!confirm('Some corrections remain flagged. Continue?'))return;try{status.textContent='Preparing report…';const r=document.querySelector('#report');r.innerHTML=`<h1>Plant Propagation Scavenger Hunt</h1><p>Merced College · AGPS-01 Elements of Plant Science</p><p><strong>${esc(state.name)}</strong> · ${esc(state.date)}<br>Collaborators: ${esc(state.peers)||'None listed'}</p>`;for(let i=0;i<15;i++){const e=state.entries[i],a=document.createElement('article');a.innerHTML=`<h2>${i+1}. ${esc(methods[i])}</h2><p>${esc(e.plant)}</p><p>${esc(e.why)}</p>`;const im=new Image();im.alt=methods[i];im.src=await rendered(e);await im.decode();a.insertBefore(im,a.children[1]);r.append(a)}document.title=state.name.trim().split(/\s+/).reverse().join('_')+'_Propagation_Scavenger_Hunt';window.print();status.textContent="Your report is ready. Save it as a PDF using your device's print or share options. Return to Canvas and upload your saved PDF to the assignment. Your work is not automatically submitted to Canvas."}catch{alert('Report preparation failed. Export a backup and try again.')}}function backup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.href=u;a.download='propagation-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function restore(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{const s=JSON.parse(await f.files[0].text());if(!Array.isArray(s.entries)||s.entries.length!==15||!s.entries.every(e=>typeof e.why==='string'&&typeof e.photo==='string'&&Array.isArray(e.marks)))throw Error();if(confirm('Replace current work with this backup?')){state=s;save();home()}}catch{alert('Invalid backup file.')}};f.click()}const req=indexedDB.open('agps01-propagation-scavenger-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('work');req.onsuccess=()=>{db=req.result;const g=db.transaction('work').objectStore('work').get('current');g.onsuccess=()=>{if(g.result)state=g.result;ready=true;status.textContent='Local storage ready';home()};g.onerror=()=>{status.textContent='Storage unavailable. Try another browser.'}};req.onerror=()=>{status.textContent='Local storage unavailable. Use a regular browser window.'};window.addEventListener('beforeunload',e=>{if(failed){e.preventDefault();e.returnValue=''}});
</script></body></html>
